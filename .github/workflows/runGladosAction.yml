name: 开始每日签到

on:
  workflow_dispatch:
  schedule:
    # 每天多时段独立触发（双保险，避开整点半点高峰）：
    # 1. 早间主力：UTC 23:25（对应北京时间 07:25，全球服务器负载低谷，几乎零排队）
    - cron: '25 23 * * *'
    # 2. 下午兜底：UTC 06:25（对应北京时间 14:25，防止漏签）
    - cron: '25 6 * * *'
  watch:
    types: [started]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install requests
      - name: Run checkin
        run: |
          python3 glados.py
        env: 
          GLADOS_COOKIE: "${{ secrets.GLADOS_COOKIE }}"
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
