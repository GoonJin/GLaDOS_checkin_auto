name: 开始每日签到

on:
  workflow_dispatch:
  schedule:
    # 每天触发两次做双保险（避开 :00 和 :30 高峰，大幅降低排队延迟）：
    # 1. 早间主力：UTC 00:28（对应北京时间 08:28，预留排队时间确保早晨完成）
    # 2. 下午兜底：UTC 06:28（对应北京时间 14:28，防止偶发漏签）
    - cron: '28 0,6 * * *'
  watch:
    types: [started]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install requests
      - name: Run checkin
        run: |
          python3 glados.py
        env: 
          GLADOS_COOKIE: "${{ secrets.GLADOS_COOKIE }}"
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
