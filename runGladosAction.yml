name: 开始每日签到

on:
  workflow_dispatch: # 仅保留手动触发测试入口，已彻底关闭定时调度与自动触发，避免每天失败告警
  # schedule:
  #   - cron: '25 23 * * *'
  #   - cron: '25 6 * * *'
  # watch:
  #   types: [started]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install requests
      - name: Run checkin
        run: |
          python3 glados.py
        env: 
          GLADOS_COOKIE: "${{ secrets.GLADOS_COOKIE }}"
          GLADOS_USER_AGENT: "${{ secrets.GLADOS_USER_AGENT }}"
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
